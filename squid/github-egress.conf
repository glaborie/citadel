# Egress proxy with a domain allowlist.
#
# The sandbox has no route off the host. This proxy is the single door and it
# only opens for api.github.com over HTTPS. Everything else is refused.

http_port 3128
visible_hostname citadel-egress

acl SSL_ports port 443
acl CONNECT method CONNECT
acl github dstdomain api.github.com

http_access allow CONNECT SSL_ports github
http_access deny all

cache deny all
cache_dir ufs /var/spool/squid 32 16 256
