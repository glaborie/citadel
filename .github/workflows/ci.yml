name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The gates are independent, so they run as parallel jobs. `check` is the
# aggregator that branch protection requires: it adds no work of its own and
# fails when any shard does, leaving the required status context stable.
#
# The workflow itself always starts, whatever changed: `check` is a required
# status context, and a workflow skipped by `paths:` never reports it, which
# leaves the pull request unable to merge. So the filtering happens per job,
# after one job has decided what actually changed.
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the base commit has to be in the clone
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A scheduled, manual, new-branch or force-pushed run cannot be diffed
          # against a known base, so it runs everything. Unknown means changed.
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] \
             || [ -z "${BASE:-}" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            python=true
          elif git diff --name-only "$BASE"...HEAD | grep -Eq \
               '^(src|tests|evals|scripts|skills|policy|migrations)/|^(pyproject\.toml|uv\.lock|Makefile|\.python-version)$|^\.github/workflows/ci\.yml$'; then
            python=true
          else
            python=false
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
  lint:
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; the checkout credential is a token to steal.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .

  typecheck:
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; the checkout credential is a token to steal.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; the checkout credential is a token to steal.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      # Live tests (CITADEL_LIVE_TESTS) skip themselves; this is the offline suite.
      - run: uv run pytest

  eval:
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; the checkout credential is a token to steal.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Grade the fixtures
        run: uv run python -m citadel.evals
      # Publish first, gate second: the table is what a reviewer compares, and it has
      # to exist for the failing run too.
      - name: Baseline table
        run: uv run python -m citadel.evals --table | tee eval-baseline.md
      - name: Baseline table in the job summary
        if: always()
        run: cat eval-baseline.md >> "$GITHUB_STEP_SUMMARY"
      - name: Baseline table as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-baseline
          path: eval-baseline.md
          retention-days: 30
      - name: Gate on the baseline
        run: uv run python -m citadel.evals --gate

  check:
    needs: [changes, lint, typecheck, test, eval]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every shard passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
