name: Code Smell Detection
on: 
  pull_request:
    branches:
    - master

jobs:
  smell-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Only needed if you want PR comments (e.g., with Smelly Python)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install smellcheck
        run: pip install smellcheck
      - name: Run smellcheck
        run: |
          smellcheck src/ --min-severity warning --baseline .smellcheck-baseline.json --fail-on warning
