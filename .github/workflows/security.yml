name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC — off-peak, avoids minute-0 congestion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ───────────────────────────── SAST ─────────────────────────────
  bandit:
    permissions:
      contents: read
      security-events: write   # upload-sarif writes here, and nowhere else
    name: SAST · Bandit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          # Optional but recommended: tie cache invalidation to your dependency files
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
      - name: Run Bandit
        # adjust `src` if your package layout differs
        run: uv run --with 'bandit[sarif]' bandit -r src -ll -ii -f sarif -o bandit.sarif
      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: bandit.sarif
          category: bandit

  semgrep:
    permissions:
      contents: read
      security-events: write   # upload-sarif writes here, and nowhere else
    name: SAST · Semgrep
    # Ordered, not because the scans depend on each other but because three
    # SARIF uploads landing within the same few seconds fail at "Uploading
    # results" (seen on #43: Bandit passed, Semgrep and CodeQL failed, and each
    # passed when re-run alone). One upload at a time is deterministic.
    needs: [bandit]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          # Optional but recommended: tie cache invalidation to your dependency files
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
      - name: Run Semgrep
        run: |
          uv run --with semgrep semgrep scan \
            --config=p/python \
            --config=p/security-audit \
            --sarif --output=semgrep.sarif \
            --error
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: SAST · CodeQL
    needs: [semgrep]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read          # required by CodeQL on non-public repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python
          queries: security-extended
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: codeql-python

  # ───────────────────────────── SCA ──────────────────────────────
  pip-audit:
    name: SCA · pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Export runtime requirements (excludes dev deps)
        run: uv export --format requirements-txt --no-dev --no-hashes -o requirements-audit.txt
      - name: Audit
        run: uv run --with pip-audit pip-audit -r requirements-audit.txt --strict

  # ─────────────────────────── Secrets ────────────────────────────
  gitleaks:
    name: Secrets · Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history — required to scan past commits
          persist-credentials: false
      - name: Install Gitleaks
        # Version and checksum from
        # https://github.com/gitleaks/gitleaks/releases/tag/v8.21.2 - bump both together.
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tgz
      - name: Scan history
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-banner
  
  # ───────────────────Static analysis for GitHub Actions───────────
  zizmor:
    name: Workflow Security · zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to the Security tab
      actions: read            # required by upload-sarif on private repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # zizmor's own recommended hardening

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0   # bundles zizmor 1.33 by default
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          online-audits:  true

  # ─────────────────────────── Gate ──────────────────────────────
  security-check:
    name: Security · Gate
    needs: [bandit, semgrep, codeql, pip-audit, gitleaks, zizmor]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all security jobs passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: codeql   # remove if you disable CodeQL entirely
