name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC — off-peak, avoids minute-0 congestion
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required for SARIF upload to the Security tab

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ───────────────────────────── SAST ─────────────────────────────
  bandit:
    name: SAST · Bandit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Run Bandit
        # adjust `src` if your package layout differs
        run: uv run --with 'bandit[sarif]' bandit -r src -ll -ii -f sarif -o bandit.sarif
      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Run Semgrep
        run: |
          uv run --with semgrep semgrep scan \
            --config=p/python \
            --config=p/security-audit \
            --sarif --output=semgrep.sarif \
            --error
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: SAST · CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read          # required by CodeQL on non-public repos
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-python

  # ───────────────────────────── SCA ──────────────────────────────
  pip-audit:
    name: SCA · pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Export runtime requirements (excludes dev deps)
        run: uv export --format requirements-txt --no-dev --no-hashes -o requirements-audit.txt
      - name: Audit
        run: uv run --with pip-audit pip-audit -r requirements-audit.txt --strict

  # ─────────────────────────── Secrets ────────────────────────────
  gitleaks:
    name: Secrets · Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — required to scan past commits
      - name: Install Gitleaks
        # bump to the latest release from https://github.com/gitleaks/gitleaks/releases
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: gitleaks detect --source . --verbose --redact --no-banner

  # ─────────────────────────── Gate ──────────────────────────────
  security-check:
    name: Security · Gate
    needs: [bandit, semgrep, codeql, pip-audit, gitleaks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all security jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: codeql   # remove if you disable CodeQL entirely
