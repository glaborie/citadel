version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly" }
    # A version published minutes ago is the one an attacker controls; security
    # updates bypass this. Seen by zizmor as dependabot-cooldown.
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same reasoning as the pip entry above: a version published minutes ago is
    # the one an attacker controls, and security updates bypass the cooldown.
    cooldown: { default-days: 7 }
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
