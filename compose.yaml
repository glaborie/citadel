# Citadel v0.1 Compose skeleton.
# Every third-party image is pinned by digest; see
# docs/implementation-notes/v0.1-verification.md for how each pin was chosen.
#
# Network model: `internal` has no route off the host. Services that must be
# reachable from the host (published ports) or that need the internet also sit
# on `edge`. Data, policy, worker and model tiers stay internal-only, so the
# tool runner and workers cannot reach the internet. OmniRoute is the only
# component that holds provider keys (architecture §1).

name: citadel

x-logging: &logging
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: .
    target: app
  image: citadel-app:0.1.0
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging
  networks:
    - internal

x-http-health: &http-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      CITADEL_DB_PASSWORD_FILE: /run/secrets/citadel_db_password
    secrets:
      - postgres_password
      - citadel_db_password
    volumes:
      # Postgres 18 keeps PGDATA under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
    networks:
      - internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    # Keycloak has no *_FILE config source, so the entrypoint reads its two
    # passwords from the mounted files and exports them into the process env.
    # Exports are not part of Config.Env, which is what the proxy exposes.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        export KC_DB_PASSWORD="$$(cat /run/secrets/postgres_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh "$$@"
      - --
    command:
      - start
      - --http-enabled=true
      - --hostname-strict=false
      - --health-enabled=true
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_HEALTH_ENABLED: "true"
      # Fixed issuer so tokens validate the same way from the host and from
      # inside the network; the API fetches JWKS over the internal URL.
      KC_HOSTNAME: http://localhost:18081
    secrets:
      - postgres_password
      - keycloak_admin_password
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak ships no HTTP client, so probe the management port with bash.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *logging
    networks:
      - internal
      - edge

  temporal:
    image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    # auto-setup reads POSTGRES_PWD but has no file variant, so the entrypoint
    # reads the mounted secret and exports it before handing over.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        export POSTGRES_PWD="$$(cat /run/secrets/postgres_password)"
        exec /etc/temporal/entrypoint.sh "$$@"
      - --
    command:
      - autosetup
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_SEEDS: postgres
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Temporal binds the container IP, not loopback, so probe by hostname.
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname):7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging
    networks:
      - internal

  temporal-ui:
    image: temporalio/ui:2.58.1@sha256:ac3c13eddb4547d830991bb5eee93a5d97140134522b7297fdb2be1fe25ef925
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:18080
      # History carries run inputs, DLP verdicts and tool output: read-only,
      # loopback only, operator debugging only.
      TEMPORAL_DISABLE_WRITE_ACTIONS: "true"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging
    networks:
      - internal
      - edge

  openfga-migrate:
    image: openfga/openfga:v1.23.0@sha256:2a1b4ef95f2f27e6d420f11cf14390b4f537e699de8d18b6a07d8b355e11cf02
    # One-shot schema migration; the distroless image has no shell to chain it.
    # The URI carries no password; pgx reads it from the mounted .pgpass file,
    # so neither Config.Cmd nor Config.Env holds the credential.
    command:
      - migrate
      - --datastore-engine=postgres
      - --datastore-uri=postgres://${POSTGRES_USER}@postgres:5432/openfga?sslmode=disable
    environment:
      PGPASSFILE: /run/secrets/openfga_pgpass
    secrets:
      - openfga_pgpass
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging
    networks:
      - internal

  openfga:
    image: openfga/openfga:v1.23.0@sha256:2a1b4ef95f2f27e6d420f11cf14390b4f537e699de8d18b6a07d8b355e11cf02
    command:
      - run
      - --datastore-engine=postgres
      - --datastore-uri=postgres://${POSTGRES_USER}@postgres:5432/openfga?sslmode=disable
      - --playground-enabled=false
    environment:
      PGPASSFILE: /run/secrets/openfga_pgpass
    secrets:
      - openfga_pgpass
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    # No healthcheck: the image is distroless and carries no shell or HTTP client.
    logging: *logging
    networks:
      - internal

  omniroute:
    image: ghcr.io/cheaper-inference/omniroute:3.8.54@sha256:2c4c755a54f8ce5341bc1856580b71f47a0f16a9afab4a55f84d540810631f68
    # The image has no *_FILE support for these values, so the entrypoint reads
    # them from mounted files. OPENROUTER_API_KEY is not used by this image at
    # all: provider credentials live in its SQLite store, configured through the
    # dashboard (encrypted with STORAGE_ENCRYPTION_KEY).
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export JWT_SECRET="$$(cat /run/secrets/omniroute_jwt_secret)"
        export API_KEY_SECRET="$$(cat /run/secrets/omniroute_api_key_secret)"
        export STORAGE_ENCRYPTION_KEY="$$(cat /run/secrets/omniroute_storage_encryption_key)"
        export INITIAL_PASSWORD="$$(cat /run/secrets/omniroute_admin_password)"
        exec /app/check-permissions.sh "$$@"
      - --
    command:
      - node
      - dev/run-standalone.mjs
    environment:
      PORT: "20128"
      DATA_DIR: /app/data
    secrets:
      - omniroute_jwt_secret
      - omniroute_api_key_secret
      - omniroute_storage_encryption_key
      - omniroute_admin_password
    volumes:
      - omniroute-data:/app/data
    ports:
      - "127.0.0.1:20128:20128"
    # The image ships its own HEALTHCHECK on /healthz.
    logging: *logging
    networks:
      - internal
      - edge

  mlflow:
    # UI internal-only: workers write via OTLP, so no browser path exists. It
    # may not publish a port or join edge before the ADR-017 Keycloak proxy
    # fronts it; tests/test_mlflow_exposure.py enforces that.
    image: ghcr.io/mlflow/mlflow:v3.18.0@sha256:257204c77980b0f3450a26eb6089e487603fcdd4509529eadaf88f90669f5c13
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      # 3.x rejects non-localhost Host headers; internal callers use mlflow:5000.
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
    environment:
      # The in-server AI Gateway is what the assistant talks to (/gateway/mlflow/...).
      # Its one endpoint points at OmniRoute, so MLflow still has no route off the
      # stack: the gateway calls a sibling service, and OmniRoute remains the only
      # egress. Requested by the operator so the assistant can answer at all.
      MLFLOW_ENABLE_AI_GATEWAY: "true"
      # The gateway refuses a private upstream by default (SSRF guard). OmniRoute is
      # private on purpose, so this is the one host the guard must allow.
      MLFLOW_GATEWAY_API_BASE_ALLOW_PRIVATE_IPS: "true"
      # A sibling service on an internal network speaks http, not https; the default
      # allowlist is https-only. Paired with the private-IP allowance above, this lets
      # the gateway reach exactly one class of upstream: named services inside the stack.
      MLFLOW_GATEWAY_API_BASE_ALLOWED_SCHEMES: "https,http"
      # The assistant API refuses any caller that is not loopback, and the UI reaches this
      # server through a socat sidecar, so its requests arrive from the bridge. These two
      # flags are what the server itself requires to accept that caller: remote mode, plus
      # the sandbox flag (remote access is gated on a sandboxed tool environment). Without
      # docker in this container a turn that calls Bash or the file tools fails at container
      # start; answering turns work. See docs/observability-mlflow-assistant.md.
      MLFLOW_ENABLE_REMOTE_ASSISTANT: "true"
      MLFLOW_ENABLE_ASSISTANT_SANDBOX: "true"
      # The gateway needs the OmniRoute key to call it, and it arrives the way every
      # other credential does: as a file, never as an environment value (the custody
      # test enforces that). The bootstrap reads it once and turns it into a gateway
      # secret, so the key is not needed again after that.
      OMNIROUTE_API_KEY_FILE: /run/secrets/omniroute_api_key
    secrets:
      - omniroute_api_key
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
    networks:
      - internal


  # One-shot: a fresh MLflow volume has no experiment, and a span written to an absent
  # experiment is rejected by MLflow (404 RESOURCE_DOES_NOT_EXIST) and then dropped by
  # the exporter. Every service that exports spans waits for this to exit 0, so `make up`
  # needs no second command. Idempotent: it creates only when the name is absent, and it
  # compares the id it finds with the one the workers are configured with, because a
  # volume whose experiment has drifted would drop every span silently.
  mlflow-bootstrap:
    <<: *app
    restart: "no"
    command: ["python", "-m", "citadel.mlflow_bootstrap"]
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-citadel-trajectories}
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-1}
      CITADEL_TRACE_CONTENT: "${CITADEL_TRACE_CONTENT:-summary}"  # full is an explicit dev opt-in: traces carry text only after the DLP gate
    depends_on:
      mlflow:
        condition: service_healthy

  prometheus:
    # Scrapes every /metrics endpoint with the shared bearer token. Internal
    # only and no published port: the dashboards in Grafana are the only view,
    # and the UI carries no control decision (ADR-015). Retention is a flag, so
    # the disk ceiling is explicit rather than a surprise.
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    secrets:
      - metrics_token
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging
    networks:
      - internal

  grafana:
    # Operator UI for the metrics. Internal only and no published port: Docker
    # binds nothing on an internal network, and an unauthenticated dashboard
    # would be a hole anyway. Reach it through the loopback socat sidecar in
    # docs/architecture/metrics.md, the same pattern as scripts/mlflow-ui.sh.
    # The admin password is read from a file secret, never an env value.
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No internet route; turn the outbound features off rather than retrying.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging
    networks:
      - internal

  presidio:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    environment:
      PORT: "3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *logging
    networks:
      - internal

  qdrant:
    # Per-tenant collections (ADR-005): the collection name is the tenant
    # boundary, so a cross-tenant read is a collection that does not exist.
    # Internal only; no port, no credentials to leak or rotate.
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image carries no curl; a TCP probe from bash needs nothing else.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging
    networks:
      - internal

  reranker:
    # Cross-encoder over the fused candidates (ADR-016). In-stack, so no
    # document text leaves the host for reranking. The embedding endpoint is
    # hosted and sees only DLP-redacted text (ADR-025). The model is baked into
    # the image at a pinned revision, so there is no runtime fetch and the
    # service needs no egress (issue #148); `make up` builds it on first use.
    # Hardened like the tool-runner (issue #227): unprivileged user, all
    # capabilities dropped. TEI's default port 80 needs CAP_NET_BIND_SERVICE,
    # so the server serves 8080 — CITADEL_RERANKER_URL and the healthcheck
    # follow, and tests/test_reranker_exposure.py guards the drift.
    # TEI also caps a /rerank batch at 32 by default, which 413s the 50
    # candidates the retrieval path sends (measured live); 64 covers it.
    build:
      context: .
      dockerfile: docker/reranker.Dockerfile
    image: citadel-reranker:0.1.0
    command: ["--model-id", "/models", "--port", "8080", "--max-client-batch-size", "64"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 128
    # TEI's warmup spikes past 512m (137/OOM at 512m, measured); the steady
    # footprint is well under this.
    mem_limit: 1024m
    healthcheck:
      # A bash TCP probe needs nothing else in the image.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    logging: *logging
    networks:
      - internal

  searxng:
    # Public search for the Researcher. It needs the internet, so it sits on
    # `web`; it also needs to be reachable by the researcher worker, so it sits
    # on `research` (internal). It is deliberately not on `edge` and publishes
    # no port: the only caller is the worker, on the internal side.
    image: searxng/searxng:2026.11.23-a7163d091@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a
    user: "977:977"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/searxng:uid=977,gid=977,mode=0755
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
    networks:
      - research
      - web

  fetcher:
    # The only component that opens an arbitrary URL. The guard, byte cap, MIME
    # allowlist and timeout are in citadel.research; trafilatura is baked into
    # this image only. `web` is the internet, `research` is how the worker
    # reaches it; no `edge`, no published port, no secret.
    build:
      context: .
      target: fetcher
    image: citadel-fetcher:0.1.0
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging
    networks:
      - research
      - web

  api:
    <<: *app
    command:
      - uvicorn
      - citadel.api.app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
    environment:
      KEYCLOAK_ISSUER: http://localhost:18081/realms/citadel
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/citadel/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: citadel-agent
      CITADEL_DB_DSN_FILE: /run/secrets/db_dsn
      CITADEL_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      CITADEL_RUN_TOKEN_PRIVATE_KEY_FILE: /run/secrets/run_token_private_key
      CITADEL_DLP_URL: http://presidio:3000
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-citadel}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      CITADEL_SKILLS_DIR: /app/skills
      CITADEL_APPROVAL_TTL_SECONDS: ${CITADEL_APPROVAL_TTL_SECONDS:-300}
      CITADEL_EXPOSE_API_DOCS: "${CITADEL_EXPOSE_API_DOCS:-false}"  # dev: serve /docs and /openapi.json (unauthenticated)
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-1}
      CITADEL_TRACE_CONTENT: "${CITADEL_TRACE_CONTENT:-summary}"  # full is an explicit dev opt-in: traces carry text only after the DLP gate
    secrets:
      - db_dsn
      - run_token_private_key
      - metrics_token
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      openfga:
        condition: service_started
      mlflow-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      <<: *http-health
    networks:
      - internal
      - edge


  approval-ui:
    <<: *app
    command: ["uvicorn", "citadel.ui.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      KEYCLOAK_ISSUER: http://localhost:18081/realms/citadel
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/citadel
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/citadel/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: citadel-agent
      CITADEL_CONSOLE_CLIENT_ID: citadel-console
      CITADEL_CONSOLE_REDIRECT_URI: http://localhost:18001/callback
      CITADEL_CONSOLE_SESSION_KEY_FILE: /run/secrets/console_session_key
      CITADEL_API_URL: http://api:8000
      CITADEL_DB_DSN_FILE: /run/secrets/db_dsn
      CITADEL_APPROVAL_TTL_SECONDS: ${CITADEL_APPROVAL_TTL_SECONDS:-300}
    secrets:
      - db_dsn
      - console_session_key
    ports:
      - "127.0.0.1:18001:8001"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      <<: *http-health
    networks:
      - internal
      - edge


  worker-orchestrator:
    <<: *app
    command: ["python", "-m", "citadel.worker"]
    environment:
      CITADEL_WORKER_ROLE: orchestrator
      CITADEL_METRICS_PORT: "9100"
      CITADEL_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      TEMPORAL_ADDRESS: temporal:7233
      OPENFGA_API_URL: http://openfga:8080
      CITADEL_TOOL_RUNNER_URL: http://tool-runner:8020
      CITADEL_OPERATOR_URL: http://operator:8030
      CITADEL_DB_DSN_FILE: /run/secrets/db_dsn
      CITADEL_RUN_TOKEN_PUBLIC_KEY: ${CITADEL_RUN_TOKEN_PUBLIC_KEY}
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-citadel}
      CITADEL_APPROVAL_TTL_SECONDS: ${CITADEL_APPROVAL_TTL_SECONDS:-300}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-1}
      CITADEL_TRACE_CONTENT: "${CITADEL_TRACE_CONTENT:-summary}"  # full is an explicit dev opt-in: traces carry text only after the DLP gate
      # ADR-017 decision 3. Rate 0 means no run is sampled; the cap bounds a day.
      CITADEL_EVAL_SAMPLE_RATE: ${CITADEL_EVAL_SAMPLE_RATE:-0}
      CITADEL_EVAL_SAMPLE_CAP: ${CITADEL_EVAL_SAMPLE_CAP:-25}
      CITADEL_EVAL_DATASET_VERSION: ${CITADEL_EVAL_DATASET_VERSION:-1}
      CITADEL_EVAL_JUDGE: ${CITADEL_EVAL_JUDGE:-}
      # The model step runs here, so this worker needs the pack on disk, the
      # detector and the gateway. It is the only worker that talks to a model.
      CITADEL_SKILLS_DIR: /app/skills
      CITADEL_DLP_URL: http://presidio:3000
      CITADEL_MODEL: ${CITADEL_MODEL:-auto/best-fast}
      OMNIROUTE_URL: ${OMNIROUTE_URL:-http://omniroute:20128/v1}
      OMNIROUTE_API_KEY_FILE: /run/secrets/omniroute_api_key
      # Retrieval runs in this worker; an empty embedding alias refuses the
      # query rather than searching without its dense half.
      CITADEL_QDRANT_URL: http://qdrant:6333
      CITADEL_EMBEDDING_MODEL: ${CITADEL_EMBEDDING_MODEL:-}
      CITADEL_RERANKER_URL: http://reranker:8080
      CITADEL_CACHE_TTL_SECONDS: ${CITADEL_CACHE_TTL_SECONDS:-3600}
      CITADEL_CACHE_SIMILARITY: ${CITADEL_CACHE_SIMILARITY:-0.95}
    secrets:
      - db_dsn
      - omniroute_api_key
      - metrics_token
    depends_on:
      temporal:
        condition: service_healthy
      mlflow-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys,time; p=pathlib.Path('/tmp/citadel-heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 30 else 1)"]
      <<: *http-health

  worker-docker:
    <<: *app
    command: ["python", "-m", "citadel.worker"]
    environment:
      CITADEL_WORKER_ROLE: docker
      CITADEL_METRICS_PORT: "9100"
      CITADEL_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      TEMPORAL_ADDRESS: temporal:7233
      OPENFGA_API_URL: http://openfga:8080
      CITADEL_TOOL_RUNNER_URL: http://tool-runner:8020
      CITADEL_OPERATOR_URL: http://operator:8030
      CITADEL_DB_DSN_FILE: /run/secrets/db_dsn
      CITADEL_RUN_TOKEN_PUBLIC_KEY: ${CITADEL_RUN_TOKEN_PUBLIC_KEY}
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-citadel}
      CITADEL_APPROVAL_TTL_SECONDS: ${CITADEL_APPROVAL_TTL_SECONDS:-300}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-1}
      CITADEL_TRACE_CONTENT: "${CITADEL_TRACE_CONTENT:-summary}"  # full is an explicit dev opt-in: traces carry text only after the DLP gate
    secrets:
      - db_dsn
      - metrics_token
    depends_on:
      temporal:
        condition: service_healthy
      mlflow-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys,time; p=pathlib.Path('/tmp/citadel-heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 30 else 1)"]
      <<: *http-health

  worker-github:
    <<: *app
    command: ["python", "-m", "citadel.worker"]
    environment:
      CITADEL_WORKER_ROLE: github
      CITADEL_METRICS_PORT: "9100"
      CITADEL_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      TEMPORAL_ADDRESS: temporal:7233
      OPENFGA_API_URL: http://openfga:8080
      CITADEL_TOOL_RUNNER_URL: http://tool-runner:8020
      CITADEL_OPERATOR_URL: http://operator:8030
      CITADEL_DB_DSN_FILE: /run/secrets/db_dsn
      CITADEL_RUN_TOKEN_PUBLIC_KEY: ${CITADEL_RUN_TOKEN_PUBLIC_KEY}
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-citadel}
      CITADEL_APPROVAL_TTL_SECONDS: ${CITADEL_APPROVAL_TTL_SECONDS:-300}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-1}
      CITADEL_TRACE_CONTENT: "${CITADEL_TRACE_CONTENT:-summary}"  # full is an explicit dev opt-in: traces carry text only after the DLP gate
    secrets:
      - db_dsn
      - metrics_token
    depends_on:
      temporal:
        condition: service_healthy
      mlflow-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys,time; p=pathlib.Path('/tmp/citadel-heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 30 else 1)"]
      <<: *http-health

  worker-researcher:
    <<: *app
    command: ["python", "-m", "citadel.worker"]
    environment:
      CITADEL_WORKER_ROLE: researcher
      CITADEL_METRICS_PORT: "9100"
      CITADEL_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      TEMPORAL_ADDRESS: temporal:7233
      OPENFGA_API_URL: http://openfga:8080
      CITADEL_TOOL_RUNNER_URL: http://tool-runner:8020
      CITADEL_OPERATOR_URL: http://operator:8030
      CITADEL_DB_DSN_FILE: /run/secrets/db_dsn
      CITADEL_RUN_TOKEN_PUBLIC_KEY: ${CITADEL_RUN_TOKEN_PUBLIC_KEY}
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-citadel}
      CITADEL_APPROVAL_TTL_SECONDS: ${CITADEL_APPROVAL_TTL_SECONDS:-300}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-1}
      CITADEL_TRACE_CONTENT: "${CITADEL_TRACE_CONTENT:-summary}"  # full is an explicit dev opt-in: traces carry text only after the DLP gate
      # The two research tools run here, not in the sandbox: the fetcher is the
      # only egress point and the worker holds no CLI or socket.
      CITADEL_DLP_URL: http://presidio:3000
      CITADEL_SEARXNG_URL: http://searxng:8080
      CITADEL_FETCHER_URL: http://fetcher:8040
    secrets:
      - db_dsn
      - metrics_token
    depends_on:
      temporal:
        condition: service_healthy
      searxng:
        condition: service_healthy
      fetcher:
        condition: service_healthy
      mlflow-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys,time; p=pathlib.Path('/tmp/citadel-heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 30 else 1)"]
      <<: *http-health
    networks:
      # Internal for Temporal, policy, the ledger and DLP; `research` for the
      # two web services. It never joins `web` or `edge`.
      - internal
      - research

  operator:
    build:
      context: .
      target: operator
    image: citadel-operator:0.1.0
    # The only component that writes. It never sees model output; it accepts a
    # validated (tenant, run, tool, arguments) tuple plus the audit reference of
    # the approval. See ADR-023 item 3 and ADR-024.
    command:
      - uvicorn
      - citadel.operator.app:app
      - --host=0.0.0.0
      - --port=8030
    user: "10001:10001"
    group_add:
      - "${DOCKER_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 256m
    environment:
      CITADEL_DB_DSN_FILE: /run/secrets/db_dsn
      DOCKER_HOST: unix:///var/run/docker.sock
      # The write token is injected into the gh child, never the service env.
      GH_TOKEN_FILE: /run/secrets/gh_write_token
      # DLP is the only reason this service is allowed to return command text.
      CITADEL_DLP_URL: http://presidio:3000
      # gh reaches GitHub only through the domain-allowlisted proxy. Loopback
      # and the Docker proxy must bypass it or the healthcheck breaks.
      HTTPS_PROXY: http://github-egress:3128
      HTTP_PROXY: http://github-egress:3128
      NO_PROXY: localhost,127.0.0.1,docker-socket-proxy,presidio
      no_proxy: localhost,127.0.0.1,docker-socket-proxy,presidio
    secrets:
      - db_dsn
      - gh_write_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      presidio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    networks:
      - internal

  github-egress:
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes:
      - ./squid/github-egress.conf:/etc/squid/squid.conf:ro
    # Squid's entrypoint drops to the proxy user, which needs SETUID/SETGID, so
    # this one service keeps its default capabilities. It is a fixed-config
    # proxy whose only reachable destination is api.github.com.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging
    networks:
      - internal
      - edge

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    # Read-only surface only: listing, inspection and logs. POST stays off so
    # the proxy cannot create, exec, delete or restart anything (ADR-023).
    environment:
      CONTAINERS: "1"
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      SYSTEM: "0"
      EVENTS: "0"
      BUILD: "0"
      SWARM: "0"
      SECRETS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The pinned image allows all of /containers when CONTAINERS=1, including
      # /archive and /export (upstream PR #183 is unmerged). This template
      # denies those two and forwards only Citadel's own container names.
      - ./docker/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    read_only: true
    tmpfs:
      # The entrypoint renders haproxy.cfg in /tmp and writes a pidfile in /run.
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - sandbox

  tool-runner:
    build:
      context: .
      target: sandbox
    image: citadel-sandbox:0.1.0
    # Hardened sandbox per ADR-012/ADR-023. gVisor runsc is unavailable on this
    # host, so these flags plus the proxy split are the whole isolation boundary.
    command:
      - uvicorn
      - citadel.tools.runner:app
      - --host=0.0.0.0
      - --port=8020
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Verifies the run token every /execute call must present. Public key
      # only: the sandbox can verify a run's identity but never mint one.
      CITADEL_RUN_TOKEN_PUBLIC_KEY: ${CITADEL_RUN_TOKEN_PUBLIC_KEY}
      # Output is only served after this service has redacted it.
      CITADEL_DLP_URL: http://presidio:3000
      # All sandbox egress goes through the domain-allowlisted proxy.
      HTTPS_PROXY: http://github-egress:3128
      HTTP_PROXY: http://github-egress:3128
      # Loopback and in-stack calls must never traverse the egress proxy.
      NO_PROXY: localhost,127.0.0.1,docker-socket-proxy,presidio
      no_proxy: localhost,127.0.0.1,docker-socket-proxy,presidio
      # gh reads GH_TOKEN; the token comes from the mounted read-only secret.
      GH_TOKEN_FILE: /run/secrets/gh_read_token
    secrets:
      - gh_read_token
    depends_on:
      presidio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    networks:
      # `internal` so workers can reach it; `sandbox` only it and the proxy.
      - internal
      - sandbox

  # One-shot knowledge ingestion: `make ingest TENANT=lab-a`. Not started by
  # `up`; it is the only service with the knowledge mount and the read token,
  # and it talks to GitHub only through the same domain-allowlisted proxy.
  ingest:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    # Entrypoint, not command: `docker compose run ingest --tenant …` must append
    # the arguments to the module, not replace the whole command line.
    entrypoint: ["python", "-m", "citadel.retrieval.ingest"]
    environment:
      CITADEL_QDRANT_URL: http://qdrant:6333
      CITADEL_INGEST_ROOT: /knowledge
      CITADEL_INGEST_REPOS: ${CITADEL_INGEST_REPOS:-}
      CITADEL_EMBEDDING_MODEL: ${CITADEL_EMBEDDING_MODEL:-}
      CITADEL_DLP_URL: http://presidio:3000
      OMNIROUTE_URL: ${OMNIROUTE_URL:-http://omniroute:20128/v1}
      OMNIROUTE_API_KEY_FILE: /run/secrets/omniroute_api_key
      GH_TOKEN_FILE: /run/secrets/gh_read_token
      HTTPS_PROXY: http://github-egress:3128
      HTTP_PROXY: http://github-egress:3128
      # Qdrant, OmniRoute and Presidio are in-stack and must never traverse the
      # egress proxy: the proxy allowlist would refuse them.
      NO_PROXY: localhost,127.0.0.1,qdrant,omniroute,presidio
    secrets:
      - gh_read_token
      - omniroute_api_key
    volumes:
      - ./knowledge:/knowledge:ro
    depends_on:
      qdrant:
        condition: service_healthy
      presidio:
        condition: service_healthy
    logging: *logging
    networks:
      - internal
      - sandbox


volumes:
  postgres-data:
  omniroute-data:
  mlflow-data:
  qdrant-data:
  prometheus-data:
  grafana-data:

# Injected from the host environment (i.e. .env) and mounted as files, so they
# never appear in a container's Config.Env, which the Docker API exposes.
# `scripts/provision-secrets.sh` writes these files; see `make up`.
secrets:
  db_dsn:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/db_dsn
  metrics_token:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/metrics_token
  grafana_admin_password:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/grafana_admin_password
  run_token_private_key:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/run_token_private_key
  console_session_key:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/console_session_key
  gh_write_token:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/gh_write_token
  gh_read_token:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/gh_read_token
  postgres_password:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/postgres_password
  citadel_db_password:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/citadel_db_password
  keycloak_admin_password:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/keycloak_admin_password
  openfga_pgpass:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/openfga_pgpass
  omniroute_jwt_secret:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/omniroute_jwt_secret
  omniroute_api_key_secret:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/omniroute_api_key_secret
  omniroute_storage_encryption_key:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/omniroute_storage_encryption_key
  omniroute_admin_password:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/omniroute_admin_password
  omniroute_api_key:
    file: ${CITADEL_SECRETS_DIR:-./secrets}/omniroute_api_key

networks:
  internal:
    internal: true
  edge: {}
  # The proxy must never be reachable from the general internal network.
  sandbox:
    internal: true
  # Researcher worker <-> SearXNG/fetcher only. Internal, so a compromised
  # worker cannot use it to reach the internet directly.
  research:
    internal: true
  # The only network with a route off the host that the web services use.
  # Deliberately distinct from `edge`, which the host-reachable services share.
  web: {}
