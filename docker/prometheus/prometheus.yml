# Scrape config for the Citadel metrics endpoints (#190).
# Every target requires the bearer token from the metrics_token secret; that is
# why the authorization block sits on the job rather than on each target.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules live beside this file under rules/ and are mounted from the
# repository; see docs/architecture/metrics.md. A missing rule file fails the
# container start rather than silently evaluating nothing.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: citadel
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets:
          - api:8000
          - worker-orchestrator:9100
          - worker-docker:9100
          - worker-github:9100
          - worker-researcher:9100
