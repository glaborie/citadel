[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citadel"
description = "Zero-trust agentic runtime for homelab DevOps"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "openfga-sdk>=0.10.6",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.15.1",
    "temporalio>=1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.9",
]

[tool.hatch.version]
path = "src/citadel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/citadel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "redteam: security cases and manifest checks for the red-team pack",
        "live: requires the compose stack; opt in with CITADEL_LIVE=1",
]
